services:
  - type: web
    name: nova-freelance-platform
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nova-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: nova-postgres
    databaseName: nova
    user: nova_user
    plan: free
    region: oregon
